name: Deploy to Cloudflare Pages

# Builds the static site with Bun and deploys dist/ to the "locallaw" Pages
# project on every push to main. The data in public/data/ is committed, so CI
# does not run the Python pipeline — only `bun run build`.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; cancel an in-flight one if a newer push lands.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main targets the project's production branch, so this
          # updates locallaw.pages.dev (not a preview deployment).
          command: pages deploy dist --project-name=locallaw --branch=main
